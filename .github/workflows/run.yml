name: run

on:
  workflow_dispatch:
  schedule:
    - cron: '10 4,16 * * *'   # UTC：北京 12:10 与 00:10（刻意避开整点，GitHub 实际会延迟 1-3 小时）

# 两次定时可能因延迟而重叠，串行执行，避免同一账号被并发签到
concurrency:
  group: glados-checkin
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run main
        env:
          GLADOS: ${{ secrets.GLADOS }}
          GLADOS_UA: ${{ secrets.GLADOS_UA }}
          DOMAIN: ${{ secrets.DOMAIN }}
          NOTIFY: ${{ secrets.NOTIFY }}
