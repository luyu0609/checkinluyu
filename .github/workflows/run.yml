name: run

on:
  workflow_dispatch:
  schedule:
    - cron: '10 16 * * *'   # UTC 16:10 = 北京次日 00:10（刻意避开整点，GitHub 实际会延迟 1-3 小时）

permissions:
  contents: write   # 末尾的保活步骤需要提交，签到本身只读

# 手动触发可能与定时撞车，串行执行，避免同一账号被并发签到
concurrency:
  group: glados-checkin
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run main
        env:
          GLADOS: ${{ secrets.GLADOS }}
          GLADOS_UA: ${{ secrets.GLADOS_UA }}
          DOMAIN: ${{ secrets.DOMAIN }}
          NOTIFY: ${{ secrets.NOTIFY }}

      # 与 keepalive.yml 互为备份：签到每天跑，由它兜住"60 天无提交即禁用定时任务"这条规则。
      # 保活失败不影响签到结论，因此 continue-on-error。
      - name: 保活（距上次提交超过 20 天才更新）
        continue-on-error: true
        env:
          THRESHOLD: 20
        run: |
          set -eu
          last=$(git log -1 --format=%ct)
          days=$(( ($(date +%s) - last) / 86400 ))
          echo "距上次提交 ${days} 天（阈值 ${THRESHOLD} 天）"
          if [ "$days" -lt "${THRESHOLD}" ]; then
            echo "未超过阈值，跳过"
            exit 0
          fi
          mkdir -p .github
          printf 'Last checkin keepalive: %s\n' "$(date -u '+%F %T UTC')" > .github/last-checkin.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-checkin.txt
          git commit -m "chore: checkin keepalive（${days} 天无提交）"
          git push
